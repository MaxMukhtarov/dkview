[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dkview"
description = "Docker and Swarm ops you can read, on servers that have no internet: colored tables, doctor, errors and a dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.7"
dynamic = ["version"]
authors = [{ name = "Mamurjon" }]
keywords = ["docker", "swarm", "podman", "cli", "table", "ops", "offline", "air-gapped"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/MaxMukhtarov/pprint-docker"
Source = "https://github.com/MaxMukhtarov/pprint-docker"
Issues = "https://github.com/MaxMukhtarov/pprint-docker/issues"

[project.scripts]
dkview = "dkview.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "dkview.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
