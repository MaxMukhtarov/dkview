name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.7", os: ubuntu-22.04 }
          - { python: "3.8", os: ubuntu-latest }
          - { python: "3.10", os: ubuntu-latest }
          - { python: "3.12", os: ubuntu-latest }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pyflakes
      - run: python -m pyflakes src tests
      - run: python -m pytest -q

  desktop:
    # Docker Desktop machines: no daemon here, but the code must run on the OS
    # (colors, encodings, paths). Tests needing the fake docker skip on Windows.
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Run the command itself
        env:
          PYTHONPATH: src
        run: |
          python -m dkview --version
          python -m dkview --help
          python -m dkview shell-init powershell

  podman:
    name: real podman
    runs-on: ubuntu-24.04
    env:
      DKVIEW_ENGINE: podman
      REAL_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: podman version
      - run: podman pull docker.io/library/busybox:latest
      - run: python -m pip install pytest
      - run: python -m pytest -v tests/real

  docker:
    # The whole tool against real docker daemons, oldest supported to newest.
    name: real docker ${{ matrix.docker }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker: ["20.10.24", "24.0.9", "27.5.1", "29.8.2"]
    services:
      dind:
        image: docker:${{ matrix.docker }}-dind
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
    env:
      DOCKER_HOST: tcp://localhost:2375
      REAL_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docker CLI ${{ matrix.docker }}
        run: |
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-${{ matrix.docker }}.tgz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/docker" >> "$GITHUB_PATH"
      - name: Wait for the daemon
        run: |
          for i in $(seq 60); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker version
      - run: docker pull busybox:latest
      - run: python -m pip install pytest
      - run: python -m pytest -v tests/real

  package:
    # What PyPI will get: metadata accepted, README renders, the wheel installs
    # into a clean environment and the `dkview` command runs.
    name: package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: make check
      - run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/dkview-[0-9]*.whl
          /tmp/venv/bin/dkview --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/dkview-[0-9]*
